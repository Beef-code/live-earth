  CAMS.forEach(c=>c.__cc.forEach((z,i)=>{
    if(!m.has(z)) m.set(z,{zh:z,en:c.__ce[i]||z,n:0});
    m.get(z).n++;
  }));
  return [...m.values()].sort((a,b)=> b.n-a.n || a.zh.localeCompare(b.zh,"zh"));
})();

const F={src:"all", ctry:"all", cat:"all"};
function matchCam(c){
  if(F.src!=="all" && srcOf(c)!==F.src) return false;
  if(F.cat!=="all" && c.cat!==F.cat) return false;
  if(F.ctry!=="all" && c.__cc.indexOf(F.ctry)<0) return false;
  return true;
}

  const tip=document.getElementById("tip");
  map.on("mousemove","cam-core",e=>{ map.getCanvas().style.cursor="pointer"; const f=e.features[0]; const cam=CAMS.find(c=>c.name===f.properties.name)||{}; tip.style.display="block"; tip.style.left=(e.point.x+14)+"px"; tip.style.top=(e.point.y+10)+"px"; tip.textContent=camName(cam)+" · "+camPlace(cam); });

     只喂给图层当前这一面看得到的点。地平线角用采样投影实测，任意缩放都自动校准。 */

  function destPt(lng,lat,brg,dist){ const d=dist*Math.PI/180, b=brg*Math.PI/180, f1=lat*Math.PI/180, l1=lng*Math.PI/180;
    const f2=Math.asin(Math.sin(f1)*Math.cos(d)+Math.cos(f1)*Math.sin(d)*Math.cos(b));
    const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(f1), Math.cos(d)-Math.sin(f1)*Math.sin(f2));
    return [l2*180/Math.PI, f2*180/Math.PI]; }
  function measureHorizon(){ const c=map.getCenter(); const cpx=map.project(c); let ba=90, bd=-1;
    for(let a=10;a<=170;a+=5){ const px=map.project(destPt(c.lng,c.lat,90,a)); const d=Math.hypot(px.x-cpx.x,px.y-cpx.y); if(d>bd){ bd=d; ba=a; } }
    for(let a=Math.max(5,ba-5);a<=Math.min(175,ba+5);a+=1){ const px=map.project(destPt(c.lng,c.lat,90,a)); const d=Math.hypot(px.x-cpx.x,px.y-cpx.y); if(d>bd){ bd=d; ba=a; } }
    return ba; }
  function centralAngle(c,lon,lat){ const f1=c.lat*Math.PI/180, f2=lat*Math.PI/180, dl=(lon-c.lng)*Math.PI/180;
    const x=Math.sin(f1)*Math.sin(f2)+Math.cos(f1)*Math.cos(f2)*Math.cos(dl); return Math.acos(Math.max(-1,Math.min(1,x)))*180/Math.PI; }
  function applyCull(){ const h=measureHorizon(); window.__horizon=h; const c=map.getCenter(); const lim=h-0.4;
    const vis=ALLFEATS.filter(f=>centralAngle(c,f.geometry.coordinates[0],f.geometry.coordinates[1])<=lim
      && (!window.__allow || window.__allow.has(f.properties.name)));
    window.__fedNames=vis.map(f=>f.properties.name);
    const src=map.getSource("cams"); if(src) src.setData({type:"FeatureCollection",features:vis});
    if(window.__pinCam && window.__pinEl){ window.__pinEl.style.display = centralAngle(c,window.__pinCam.lon,window.__pinCam.lat)<=lim ? "" : "none"; } }
  map.on("move",()=>{ if(!cullQueued){ cullQueued=true; requestAnimationFrame(()=>{ cullQueued=false; applyCull(); }); } });
  window.__applyCull=applyCull;
  applyCull();
});

/* 自转：空闲时慢慢转，有人操作就停 */
let spinning=true, lastTouch=Date.now();
function spin(){ if(spinning && Date.now()-lastTouch>2500 && !player.classList.contains("open")){ const c=map.getCenter(); c.lng+=0.045; map.jumpTo({center:c}); } requestAnimationFrame(spin); }
["mousedown","touchstart","wheel"].forEach(e=>map.on(e,()=>{ lastTouch=Date.now(); }));
document.getElementById("spinBtn").onclick=e=>{ spinning=!spinning; e.target.textContent = spinning?L("spinPause"):L("spinRun"); };

const player=document.getElementById("player"), frame=document.getElementById("frame"), vempty=document.getElementById("vempty");
const vid=document.getElementById("vid"), snap=document.getElementById("snap");
let current=null, clockTimer=null, hls=null, snapTimer=null;

/* 本地 file:// 打开时浏览器没有 origin 可发，YouTube 播放器必然报 Error 153，这里明确提示，避免误判成站点坏了 */
if(location.protocol==="file:"){
  const bar=document.createElement("div");
  bar.id="fileWarn";
  bar.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:linear-gradient(90deg,#b3341a,#d4631f);color:#fff;font:13px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;padding:10px 44px 10px 16px;text-align:center";
  bar.innerHTML='<span id="fileWarnTxt"></span>';
  const x=document.createElement("button");
  x.textContent="✕";
  x.style.cssText="position:absolute;right:12px;top:8px;background:transparent;border:0;color:#fff;font-size:16px;cursor:pointer;opacity:.8";
  x.onclick=()=>bar.remove();
  bar.appendChild(x);
  document.body.appendChild(bar);
  document.body.style.paddingTop="46px";
}

function camType(cam){ return cam.type || (cam.yt||cam.channel ? "yt" : ""); }
function embedUrl(cam){
  if(cam.yt) return "https://www.youtube.com/embed/"+cam.yt+"?autoplay=1&mute=1&rel=0&playsinline=1";
  if(cam.channel) return "https://www.youtube.com/embed/live_stream?channel="+cam.channel+"&autoplay=1&mute=1&rel=0";
  return "";
}
function stopMedia(){
  if(hls){ try{hls.destroy();}catch(e){} hls=null; }
  clearInterval(snapTimer); snapTimer=null;
  try{ vid.pause(); vid.removeAttribute("src"); vid.load(); }catch(e){}
  frame.removeAttribute("src");
  frame.style.display="none"; vid.style.display="none"; snap.style.display="none";
}
function localTime(tz){ try{ return new Intl.DateTimeFormat("zh-CN",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,weekday:"short"}).format(new Date()); }catch(e){ return ""; } }

let selPin=null;
function markSelected(cam){
  if(selPin){ selPin.remove(); selPin=null; }
  try{ map.setFilter("cam-sel",["==",["get","name"],cam.iss?"__none__":cam.name]); }catch(e){}
  if(!cam.iss){
    const el=document.createElement("div"); el.className="sel-pin"; el.textContent="📍";
    selPin=new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([cam.lon,cam.lat]).addTo(map);
    window.__pinCam=cam; window.__pinEl=el;
  } else { window.__pinCam=null; window.__pinEl=null; }
}
/* 播放面板的文案（语言切换时也走这里重刷，不重载媒体） */
function renderBadge(t){
  return t==="hls" ? '<span class="livebadge hls">'+L("badgeHls")+'</span>'
    : (t==="img"||t==="sgapi") ? '<span class="livebadge img">'+L("badgeSnap")+'</span>'
    : '<span class="livebadge">'+L("live")+'</span>';
}
/* B 站：官方第三方播放器 blanc。B站接口对「外部 Referer」返回 403，对「无 Referer」返回 200，
   所以 iframe 必须带 referrerpolicy="no-referrer"，否则播放器取不到流、一片黑。 */
function setBiliMode(cam, on){
  if(!cam || !cam.bili) return;
  if(on){
    snap.style.display="none"; vempty.style.display="none";
    frame.referrerPolicy="no-referrer";
    frame.style.display="block";
    frame.src="https://live.bilibili.com/blanc/"+cam.bili+"?liteVersion=true&danmaku=false&highQuality=true&autoplay=true";
  } else {
    frame.removeAttribute("src"); frame.style.display="none";
    frame.referrerPolicy="strict-origin-when-cross-origin";
    snap.style.display="block";
  }
  const b=document.getElementById("biliBtn");
  if(b) b.textContent = frame.style.display==="none" ? L("tryBili") : L("backSnap");
}
function renderPlayerTexts(){
  const cam=current; if(!cam) return;
  const t=camType(cam);
  document.getElementById("pTitle").innerHTML = renderBadge(t)+camName(cam);
  document.getElementById("pDesc").textContent = camDesc(cam)||"";
  document.getElementById("pSub").textContent = subText(cam);
  document.getElementById("expandBtn").textContent = player.classList.contains("max")?L("shrink"):L("expand");
  document.getElementById("nextBtn").textContent = L("next");
  document.getElementById("close").title = isZh()?"关闭":"Close";
  const srcBtn=document.getElementById("openSrc");
  if(t==="yt"){
    srcBtn.style.display=""; srcBtn.textContent=L("openYt");
    srcBtn.onclick=()=>window.open(cam.yt?("https://www.youtube.com/watch?v="+cam.yt):("https://www.youtube.com/results?search_query="+encodeURIComponent(cam.en+" live cam")),"_blank");
  } else if(cam.page){
    srcBtn.style.display=""; srcBtn.textContent=L("openPage"); srcBtn.onclick=()=>window.open(cam.page,"_blank");
  } else { srcBtn.style.display="none"; }
  if(cam.noembed) showNoEmbed(cam);
  const bb=document.getElementById("biliBtn");
  if(bb){
    if(cam.bili){ bb.style.display=""; bb.textContent = frame.style.display==="none" ? L("tryBili") : L("backSnap"); }
    else bb.style.display="none";
  }
}
function showNoEmbed(cam){
  vempty.style.display="flex";
  vempty.innerHTML='<div style="max-width:360px;line-height:1.75"><div style="font-size:32px;margin-bottom:10px">🚫</div>'
    +'<div style="color:#d7e6ff;font-size:14px;font-weight:600;margin-bottom:8px">'+L("nbTitle")+'</div>'
    +'<div style="font-size:12.5px;color:#8fa8cc;margin-bottom:16px">'+L("nbBody")+'</div>'
    +'<button id="noembedGo" style="cursor:pointer;border:0;border-radius:999px;padding:10px 22px;background:#e5484d;color:#fff;font-size:13px;font-weight:600">'+L("nbBtn")+'</button></div>';
  document.getElementById("noembedGo").onclick=()=>window.open("https://www.youtube.com/watch?v="+cam.yt,"_blank");
}
function openCam(cam, fly=true){
  current=cam; stopMedia(); markSelected(cam);
  document.querySelectorAll("#list .item").forEach(el=>el.classList.toggle("active", el.dataset.name===cam.name));
  const t=camType(cam);
  vempty.style.display="none";
  if(cam.noembed){
    frame.style.display="none";
  } else if(t==="yt"){
    const url=embedUrl(cam);
    if(url){ frame.referrerPolicy="strict-origin-when-cross-origin"; frame.style.display="block"; frame.src=url; }
    else { vempty.style.display="flex"; vempty.textContent=L("noSrc"); }
  } else if(t==="hls"){
    vid.style.display="block";
    if(window.Hls && Hls.isSupported()){ hls=new Hls({liveSyncDurationCount:3}); hls.loadSource(cam.src); hls.attachMedia(vid); hls.on(Hls.Events.MANIFEST_PARSED,()=>{ vid.play().catch(()=>{}); }); }
    else if(vid.canPlayType("application/vnd.apple.mpegurl")){ vid.src=cam.src; vid.play().catch(()=>{}); }
    else { vempty.style.display="flex"; vempty.textContent=L("noHls"); }
  } else if(t==="img"||t==="sgapi"){
    snap.style.display="block";
    const load=()=>{
      if(t==="sgapi"){
        fetch(cam.api).then(r=>r.json()).then(d=>{ const c=(d.items[0].cameras||[]).find(x=>x.camera_id===cam.camId); if(c) snap.src=c.image; }).catch(()=>{});
      } else { snap.src=cam.src+(cam.src.includes("?")?"&":"?")+"t="+Date.now(); }
    };
    load(); snapTimer=setInterval(load,(cam.refresh||60)*1000);
  }
  renderPlayerTexts();
  const tick=()=>{ if(current) document.getElementById("pSub").textContent = subText(current); };
  clearInterval(clockTimer); clockTimer=setInterval(tick,1000);
  player.classList.add("open");
  if(fly && !cam.iss) map.flyTo({center:[cam.lon,cam.lat], zoom:Math.max(map.getZoom(),3.4), speed:0.9, curve:1.4, essential:true});
}
document.getElementById("close").onclick=()=>{ player.classList.remove("open"); player.classList.remove("max"); document.getElementById("expandBtn").textContent=L("expand"); stopMedia(); clearInterval(clockTimer); if(selPin){ selPin.remove(); selPin=null; } window.__pinCam=null; window.__pinEl=null; try{ map.setFilter("cam-sel",["==",["get","name"],"__none__"]); }catch(e){} };
document.getElementById("expandBtn").onclick=e=>{ const m=player.classList.toggle("max"); e.target.textContent = m ? L("shrink") : L("expand"); };
document.getElementById("biliBtn").onclick=()=>{ if(current && current.bili) setBiliMode(current, frame.style.display==="none"); };
document.getElementById("nextBtn").onclick=()=>randomCam();
document.getElementById("randomBtn").onclick=()=>randomCam();
function randomCam(){ const pool=filteredCams().filter(c=>!c.disabled); if(!pool.length) return; openCam(pool[Math.floor(Math.random()*pool.length)]); }

/* ============ 左栏：来源 / 国家 / 类型 筛选 + 列表 ============ */
const list=document.getElementById("list");
function renderList(){
  const arr=filteredCams();
  window.__allow=new Set(arr.map(c=>c.name));
  if(window.__applyCull) window.__applyCull();

  const srcOpts=[["all",L("all")],["yt","YouTube"],["hls",L("hlsShort")],["img",L("snapShort")],["sgapi",L("apiShort")]];
  const ctryOpts=['<option value="all">'+L("anyCountry")+' · '+CAMS.length+'</option>']
    .concat(COUNTRY_LIST.map(o=>'<option value="'+o.zh+'"'+(F.ctry===o.zh?" selected":"")+'>'+countryName(o)+' ('+o.n+')</option>'));
  const catOpts=['<option value="all">'+L("anyCat")+'</option>']
    .concat(Object.keys(CATS).map(k=>'<option value="'+k+'"'+(F.cat===k?" selected":"")+'>'+catName({cat:k})+' ('+CAMS.filter(c=>c.cat===k).length+')</option>'));

  list.innerHTML =
    '<div id="filters">'
    + '<div class="flabel">'+L("srcLabel")+'</div>'
    + '<div class="frow">'+srcOpts.map(o=>'<button class="chip'+(F.src===o[0]?" on":"")+'" data-src="'+o[0]+'">'+o[1]+'</button>').join("")+'</div>'
    + '<div class="flabel">'+L("countryLabel")+'</div>'
    + '<div class="frow"><select data-sel="ctry">'+ctryOpts.join("")+'</select></div>'
    + '<div class="flabel">'+L("catLabel")+'</div>'
    + '<div class="frow"><select data-sel="cat">'+catOpts.join("")+'</select></div>'
    + '</div>'
    + '<div class="hd">'+L("count")+' · '+arr.length+(isZh()?" 个":"")+'</div>';

  if(!arr.length){ const e=document.createElement("div"); e.className="empty"; e.textContent=L("empty"); list.appendChild(e); }

  list.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{ F.src=b.dataset.src; renderList(); });
  list.querySelector('[data-sel="ctry"]').onchange=e=>{ F.ctry=e.target.value; renderList(); };
  list.querySelector('[data-sel="cat"]').onchange=e=>{ F.cat=e.target.value; renderList(); };

  arr.forEach(cam=>{
    const b=document.createElement("button"); b.className="item"; b.dataset.name=cam.name;
    if(current && current.name===cam.name) b.classList.add("active");
    if(cam.iss){
      b.innerHTML="<b>"+L("issLabel")+"</b><span>"+L("issSub")+"</span>";
      b.onclick=()=>openCam(cam,false);
    } else {
      const t=srcOf(cam);
      const tag = t==="yt" ? " · YouTube" : (t==="hls" ? ' · <span class="src">'+L("srcHls")+'</span>' : ' · <span class="src">'+L("srcSnap")+'</span>');
      b.innerHTML="<b>"+cam.icon+" "+camName(cam)+"</b><span>"+camPlace(cam)+" · "+catName(cam)+tag+"</span>";
      b.onclick=()=>openCam(cam);
    }
    list.appendChild(b);
  });
}

function setLang(l){
  LANG=l;
  try{ localStorage.setItem("le_lang",l); }catch(e){}
  document.documentElement.lang = isZh()?"zh-CN":"en";
  document.title=L("docTitle");
  document.getElementById("brandH1").textContent=L("h1");
  document.getElementById("brandP").textContent=L("tagline");
  document.getElementById("spinBtn").textContent=spinning?L("spinPause"):L("spinRun");
  document.getElementById("randomBtn").textContent=L("random");
  document.getElementById("langBtn").textContent=isZh()?"EN":"中文";
  document.getElementById("hint").textContent=L("hint");
  const fw=document.getElementById("fileWarnTxt"); if(fw) fw.innerHTML=L("fileWarn");
  if(current) renderPlayerTexts(); else vempty.textContent=L("pick");
  renderList();
}
document.getElementById("langBtn").onclick=()=>setLang(isZh()?"en":"zh");
setLang(LANG);
requestAnimationFrame(spin);
</script>
</body>
