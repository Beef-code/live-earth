<style>

  #player{position:absolute;right:14px;top:86px;width:min(520px,calc(100vw - 28px));z-index:6;background:rgba(6,13,28,.92);border:1px solid rgba(140,180,255,.35);border-radius:14px;overflow:hidden;backdrop-filter:blur(10px);transform:translateX(115%);transition:transform .35s cubic-bezier(.2,.8,.25,1);box-shadow:0 18px 50px rgba(0,0,0,.6)}
  /* 放大模式：盖住整个地球，只给左侧列表留出位置 */
  #player.max{left:236px;top:0;bottom:0;right:0;width:auto;border-radius:0;display:flex;flex-direction:column}
  #player.max .vwrap{padding-top:0;flex:1 1 auto}
  #player.max .meta{flex-shrink:0}
  #player.open{transform:none}
  #player .vwrap{position:relative;padding-top:56.25%;background:#000}
  #player iframe,#player video,#player img.snap{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#000}
  #player .livebadge.hls{background:#2563eb} #player .livebadge.img{background:#2e9e5b}
  #list .item .src{color:#7fd4a8}
  #player .vempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8fa8cc;font-size:13px;padding:20px;text-align:center}

  #close{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;padding:0;border-radius:50%;font-size:15px;line-height:1}
  #hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;background:rgba(5,12,26,.75);border:1px solid rgba(140,180,255,.25);color:#a9c0e2;font-size:12px;padding:6px 14px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(6px)}

<script>

   ② 直连流：type:"hls", src 填 .m3u8 地址（必须带跨域允许，否则浏览器播不了）
   ③ 官方快照：type:"img", src 填图片地址, refresh 填多少秒换一张；page 填源站页（可选）

  {name:"伦敦 · 修道院路斑马线", en:"Abbey Road Crossing", place:"英国 · 伦敦", lat:51.532, lon:-0.177, yt:"zMCea32gpmg", tz:"Europe/London", cat:"城市", icon:"🎸", desc:"披头士《Abbey Road》封面那条斑马线，EarthCam 机位。全天都有游客摆同款姿势拍照。"},
  {name:"夏威夷 · 冒纳凯阿星空", en:"Mauna Kea StarCam", place:"美国 · 夏威夷", lat:19.826, lon:-155.471, yt:"Q3UhCgsWDw8", tz:"Pacific/Honolulu", cat:"星空", icon:"🔭", desc:"CFHT 天文台的 4K 星空相机，海拔 4200 米。白天看云海和望远镜圆顶，夜里银河、流星全靠它，马来西亚晚上正好是它那边夜里。"},
  {name:"基拉韦厄火山", en:"Kilauea Volcano", place:"美国 · 夏威夷", lat:19.406, lon:-155.283, yt:"gXKuUyKt8mc", tz:"Pacific/Honolulu", cat:"自然", icon:"🌋", desc:"USGS 的火山口机位。喷发期能看到熔岩，平时是火山口和蒸汽。"},
  {name:"纽约 · 时代广场", en:"Times Square", place:"美国 · 纽约", lat:40.758, lon:-73.9855, yt:"JQ_jwk_7OVE", tz:"America/New_York", cat:"城市", icon:"🗽", desc:"EarthCam 的时代广场 4K 机位，广告屏和人流 24 小时不停。马来西亚中午打开，正好是纽约的午夜霓虹。"},

  {name:"基韦斯特海滩", en:"Key West Beach TV", place:"美国 · 佛罗里达 · 基韦斯特", lat:24.555, lon:-81.78, type:"hls", src:"https://5ed325193d4e1.streamlock.net:444/LiveTV/KTVHD/playlist.m3u8", tz:"America/New_York", cat:"水乡", icon:"🏖️", desc:"美国本土最南端小岛的海滩电视频道直连流，轮播当地海滩、码头和日落画面，不经过 YouTube。"},
  {name:"佛罗里达 30A 海岸", en:"30A Beach, Florida", place:"美国 · 佛罗里达 · 德斯坦一带", lat:30.35, lon:-86.16, type:"hls", src:"https://30a-tv.com/beachy.m3u8", tz:"America/Chicago", cat:"水乡", icon:"🌊", desc:"佛罗里达翡翠海岸（30A 公路沿线）的本地海滩频道直连流，白沙滩和墨绿海水是这一带的招牌。"},
  {name:"黄石 · 猛犸温泉", en:"Mammoth Hot Springs, Yellowstone", place:"美国 · 黄石国家公园", lat:44.97, lon:-110.70, type:"img", src:"https://www.nps.gov/webcams-yell/mammoth_parade.jpg", page:"https://www.nps.gov/yell/learn/photosmultimedia/webcams.htm", refresh:60, tz:"America/Denver", cat:"自然", icon:"♨️", desc:"国家公园管理局（NPS）官方快照机位：石灰华梯田温泉和大草坪。不是视频，是约每分钟自动换一张的实时照片。"},
  {name:"黄石 · 沃什伯恩山", en:"Mount Washburn, Yellowstone", place:"美国 · 黄石国家公园", lat:44.80, lon:-110.45, type:"img", src:"https://www.nps.gov/webcams-yell/washburn_ne.jpg", page:"https://www.nps.gov/yell/learn/photosmultimedia/webcams.htm", refresh:60, tz:"America/Denver", cat:"自然", icon:"⛰️", desc:"海拔 3122 米山顶的 NPS 官方快照，朝东北俯瞰黄石大峡谷方向，晴天视野极远。同样是自动刷新的实时照片。"},
  {name:"优胜美地山谷", en:"Yosemite Valley", place:"美国 · 加州 · 优胜美地", lat:37.73, lon:-119.58, type:"img", src:"https://www.nps.gov/featurecontent/ard/webcams/images/yoselarge.jpg", page:"https://www.nps.gov/yose/learn/photosmultimedia/webcams.htm", refresh:120, tz:"America/Los_Angeles", cat:"自然", icon:"🪨", desc:"NPS 官方高清快照（大图约 3MB，加载稍慢），花岗岩大山谷和酋长岩。每两分钟自动换一张。"},
  {name:"大峡谷南缘", en:"Grand Canyon South Rim", place:"美国 · 亚利桑那 · 大峡谷", lat:36.06, lon:-112.11, type:"img", src:"https://www.nps.gov/webcams-grca/camera.jpg", page:"https://www.nps.gov/grca/learn/photosmultimedia/webcams.htm", refresh:60, tz:"America/Phoenix", cat:"自然", icon:"🏜️", desc:"NPS 官方快照机位，从南缘看大峡谷，光影随太阳变，下午到日落最壮观。约每分钟自动换一张。"},
  {name:"雷尼尔雪山", en:"Mount Rainier", place:"美国 · 华盛顿州 · 雷尼尔国家公园", lat:46.85, lon:-121.76, type:"img", src:"https://www.nps.gov/webcams-mora/mountain.jpg", page:"https://www.nps.gov/mora/learn/photosmultimedia/webcams.htm", refresh:60, tz:"America/Los_Angeles", cat:"自然", icon:"🏔️", desc:"NPS 官方快照，从 Paradise 一带看 4392 米的雷尼尔大雪山本体。华盛顿州天气多变，抓到晴天就是大片。"},

  {name:"锡安峡谷", en:"Zion Canyon", place:"美国 · 犹他 · 锡安国家公园", lat:37.30, lon:-113.03, type:"img", src:"https://www.nps.gov/webcams-zion/camera2.jpg", page:"https://www.nps.gov/zion/learn/photosmultimedia/webcams.htm", refresh:60, tz:"America/Denver", cat:"自然", icon:"🪵", desc:"NPS 官方快照，红色砂岩大峡谷，阳光打在岩壁上的颜色从橙到紫一直在变。"},
  {name:"新加坡 · 港湾快照", en:"Singapore Harbourfront Cam", place:"新加坡 · 港湾区", lat:1.26, lon:103.82, type:"sgapi", camId:"4799", api:"https://api.data.gov.sg/v1/transport/traffic-images", page:"https://onemotoring.lta.gov.sg/content/onemotoring/home/driving/traffic_information/traffic_cameras.html", refresh:60, tz:"Asia/Singapore", cat:"城市", icon:"🇸🇬", desc:"新加坡陆交局（LTA）官方开放数据的实时快照，港湾/圣淘沙门户一带。政府开放 API，每分钟自动取最新一张。"},

];

const CATS = {"城市":"#ff9f43","水乡":"#54c8ff","自然":"#7bed6d","野生动物":"#ffd32a","星空":"#b39dff","太空":"#ff7eb6"};
const map = new maplibregl.Map({
  container:"map",
  style:{version:8,
    sources:{sat:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"Esri World Imagery"}},
    layers:[{id:"sat",type:"raster",source:"sat",paint:{"raster-brightness-max":0.82}}],
    sky:{"sky-color":"#081426","horizon-color":"#274a77","fog-color":"#04070d","sky-horizon-blend":0.6,"horizon-fog-blend":0.6,"fog-ground-blend":0.4}},
  center:[105,18], zoom:2.1, attributionControl:{compact:true}
});
map.on("load",()=>{
  map.setProjection({type:"globe"});
  /* 点直接画进地球表面（GL 图层）：跟着球面走、转到背面会被遮住，不再是浮在屏幕上的贴纸 */
  const feats=CAMS.filter(c=>!c.iss).map(c=>({type:"Feature",geometry:{type:"Point",coordinates:[c.lon,c.lat]},properties:{name:c.name,place:c.place,color:CATS[c.cat]||"#ffffff"}}));
  map.addSource("cams",{type:"geojson",data:{type:"FeatureCollection",features:feats}});
  map.addLayer({id:"cam-halo",type:"circle",source:"cams",paint:{"circle-radius":["interpolate",["linear"],["zoom"],1.5,11,4,17],"circle-color":["get","color"],"circle-opacity":0.35,"circle-blur":0.6}});
  map.addLayer({id:"cam-sel",type:"circle",source:"cams",filter:["==",["get","name"],"__none__"],paint:{"circle-radius":["interpolate",["linear"],["zoom"],1.5,13,4,20],"circle-color":"rgba(0,0,0,0)","circle-stroke-color":"#ffffff","circle-stroke-width":2.5}});
  map.addLayer({id:"cam-core",type:"circle",source:"cams",paint:{"circle-radius":["interpolate",["linear"],["zoom"],1.5,5.5,4,8.5],"circle-color":["get","color"],"circle-stroke-color":"#ffffff","circle-stroke-width":2,"circle-stroke-opacity":0.95}});
  const tip=document.getElementById("tip");
  map.on("mousemove","cam-core",e=>{ map.getCanvas().style.cursor="pointer"; const f=e.features[0]; tip.style.display="block"; tip.style.left=(e.point.x+14)+"px"; tip.style.top=(e.point.y+10)+"px"; tip.textContent=f.properties.name+" · "+f.properties.place; });
  map.on("mouseleave","cam-core",()=>{ map.getCanvas().style.cursor=""; tip.style.display="none"; });
  const pick=e=>{ const f=(e.features||[])[0]; if(!f) return; const cam=CAMS.find(c=>c.name===f.properties.name); if(cam){ lastTouch=Date.now(); openCam(cam,false); } };
  map.on("click","cam-core",pick); map.on("click","cam-halo",pick);
  /* 背面剔除：MapLibre 的球面投影会把背面坐标镜像投进圆盘里，必须按「地平线角」动态过滤，
     只喂给图层当前这一面看得到的点。地平线角用采样投影实测，任意缩放都自动校准。 */
  const ALLFEATS=feats;
  let cullQueued=false;
  function destPt(lng,lat,brg,dist){ const d=dist*Math.PI/180, b=brg*Math.PI/180, f1=lat*Math.PI/180, l1=lng*Math.PI/180;
    const f2=Math.asin(Math.sin(f1)*Math.cos(d)+Math.cos(f1)*Math.sin(d)*Math.cos(b));
    const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(f1), Math.cos(d)-Math.sin(f1)*Math.sin(f2));
    return [l2*180/Math.PI, f2*180/Math.PI]; }
  function measureHorizon(){ const c=map.getCenter(); const cpx=map.project(c); let ba=90, bd=-1;
    for(let a=10;a<=170;a+=5){ const px=map.project(destPt(c.lng,c.lat,90,a)); const d=Math.hypot(px.x-cpx.x,px.y-cpx.y); if(d>bd){ bd=d; ba=a; } }
    for(let a=Math.max(5,ba-5);a<=Math.min(175,ba+5);a+=1){ const px=map.project(destPt(c.lng,c.lat,90,a)); const d=Math.hypot(px.x-cpx.x,px.y-cpx.y); if(d>bd){ bd=d; ba=a; } }
    return ba; }
  function centralAngle(c,lon,lat){ const f1=c.lat*Math.PI/180, f2=lat*Math.PI/180, dl=(lon-c.lng)*Math.PI/180;
    const x=Math.sin(f1)*Math.sin(f2)+Math.cos(f1)*Math.cos(f2)*Math.cos(dl); return Math.acos(Math.max(-1,Math.min(1,x)))*180/Math.PI; }
  function applyCull(){ const h=measureHorizon(); window.__horizon=h; const c=map.getCenter(); const lim=h-0.4;
    const vis=ALLFEATS.filter(f=>centralAngle(c,f.geometry.coordinates[0],f.geometry.coordinates[1])<=lim);
    window.__fedNames=vis.map(f=>f.properties.name);
    const src=map.getSource("cams"); if(src) src.setData({type:"FeatureCollection",features:vis});
    if(window.__pinCam && window.__pinEl){ window.__pinEl.style.display = centralAngle(c,window.__pinCam.lon,window.__pinCam.lat)<=lim ? "" : "none"; } }
  map.on("move",()=>{ if(!cullQueued){ cullQueued=true; requestAnimationFrame(()=>{ cullQueued=false; applyCull(); }); } });
  applyCull();
});

/* 自转：空闲时慢慢转，有人操作就停 */
let spinning=true, lastTouch=Date.now();
function spin(){ if(spinning && Date.now()-lastTouch>2500 && !player.classList.contains("open")){ const c=map.getCenter(); c.lng+=0.045; map.jumpTo({center:c}); } requestAnimationFrame(spin); }
["mousedown","touchstart","wheel"].forEach(e=>map.on(e,()=>{ lastTouch=Date.now(); }));
document.getElementById("spinBtn").onclick=e=>{ spinning=!spinning; e.target.textContent = spinning?"⏸ 暂停自转":"▶ 继续自转"; };

const player=document.getElementById("player"), frame=document.getElementById("frame"), vempty=document.getElementById("vempty");
const vid=document.getElementById("vid"), snap=document.getElementById("snap");
let current=null, clockTimer=null, hls=null, snapTimer=null;

function camType(cam){ return cam.type || (cam.yt||cam.channel ? "yt" : ""); }
function embedUrl(cam){
  if(cam.yt) return "https://www.youtube.com/embed/"+cam.yt+"?autoplay=1&mute=1&rel=0&playsinline=1";
  if(cam.channel) return "https://www.youtube.com/embed/live_stream?channel="+cam.channel+"&autoplay=1&mute=1&rel=0";
  return "";
}
function stopMedia(){
  if(hls){ try{hls.destroy();}catch(e){} hls=null; }
  clearInterval(snapTimer); snapTimer=null;
  try{ vid.pause(); vid.removeAttribute("src"); vid.load(); }catch(e){}
  frame.removeAttribute("src");
  frame.style.display="none"; vid.style.display="none"; snap.style.display="none";
}
function localTime(tz){ try{ return new Intl.DateTimeFormat("zh-CN",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,weekday:"short"}).format(new Date()); }catch(e){ return ""; } }

let selPin=null;
function markSelected(cam){
  if(selPin){ selPin.remove(); selPin=null; }
  try{ map.setFilter("cam-sel",["==",["get","name"],cam.iss?"__none__":cam.name]); }catch(e){}
  if(!cam.iss){
    const el=document.createElement("div"); el.className="sel-pin"; el.textContent="📍";
    selPin=new maplibregl.Marker({element:el,anchor:"bottom"}).setLngLat([cam.lon,cam.lat]).addTo(map);
    window.__pinCam=cam; window.__pinEl=el;
  } else { window.__pinCam=null; window.__pinEl=null; }
}
function openCam(cam, fly=true){
  current=cam; stopMedia(); markSelected(cam);
  document.querySelectorAll("#list .item").forEach(el=>el.classList.toggle("active", el.dataset.name===cam.name));
  const t=camType(cam);
  const badge = t==="hls" ? '<span class="livebadge hls">📡 直连直播</span>' : (t==="img"||t==="sgapi") ? '<span class="livebadge img">📷 官方快照</span>' : '<span class="livebadge">LIVE</span>';
  document.getElementById("pTitle").innerHTML = badge+cam.name;
  document.getElementById("pDesc").textContent = cam.desc||"";
  const tick=()=>{ document.getElementById("pSub").textContent = cam.place+" · "+cam.en+" · 当地时间 "+localTime(cam.tz); };
  tick(); clearInterval(clockTimer); clockTimer=setInterval(tick,1000);
  vempty.style.display="none";
  if(t==="yt"){
    const url=embedUrl(cam);
    if(url){ frame.style.display="block"; frame.src=url; }
    else { vempty.style.display="flex"; vempty.textContent="这个点暂时没有稳定的直播源"; }
  } else if(t==="hls"){
    vid.style.display="block";
    if(window.Hls && Hls.isSupported()){ hls=new Hls({liveSyncDurationCount:3}); hls.loadSource(cam.src); hls.attachMedia(vid); hls.on(Hls.Events.MANIFEST_PARSED,()=>{ vid.play().catch(()=>{}); }); }
    else if(vid.canPlayType("application/vnd.apple.mpegurl")){ vid.src=cam.src; vid.play().catch(()=>{}); }
    else { vempty.style.display="flex"; vempty.textContent="这个浏览器不支持直连流播放，点下面按钮去源站看"; }
  } else if(t==="img"||t==="sgapi"){
    snap.style.display="block";
    const load=()=>{
      if(t==="sgapi"){
        fetch(cam.api).then(r=>r.json()).then(d=>{ const c=(d.items[0].cameras||[]).find(x=>x.camera_id===cam.camId); if(c) snap.src=c.image; }).catch(()=>{});
      } else { snap.src=cam.src+(cam.src.includes("?")?"&":"?")+"t="+Date.now(); }
    };
    load(); snapTimer=setInterval(load,(cam.refresh||60)*1000);
  }
  const srcBtn=document.getElementById("openSrc");
  if(t==="yt"){ srcBtn.style.display=""; srcBtn.textContent="▶ 在 YouTube 打开"; srcBtn.onclick=()=>window.open(cam.yt?("https://www.youtube.com/watch?v="+cam.yt):("https://www.youtube.com/results?search_query="+encodeURIComponent(cam.en+" live cam")),"_blank"); }
  else if(cam.page){ srcBtn.style.display=""; srcBtn.textContent="▶ 在源站打开"; srcBtn.onclick=()=>window.open(cam.page,"_blank"); }
  else { srcBtn.style.display="none"; }
  player.classList.add("open");
  if(fly && !cam.iss) map.flyTo({center:[cam.lon,cam.lat], zoom:Math.max(map.getZoom(),3.4), speed:0.9, curve:1.4, essential:true});
}
document.getElementById("close").onclick=()=>{ player.classList.remove("open"); player.classList.remove("max"); document.getElementById("expandBtn").textContent="⛶ 放大"; stopMedia(); clearInterval(clockTimer); if(selPin){ selPin.remove(); selPin=null; } window.__pinCam=null; window.__pinEl=null; try{ map.setFilter("cam-sel",["==",["get","name"],"__none__"]); }catch(e){} };
document.getElementById("expandBtn").onclick=e=>{ const m=player.classList.toggle("max"); e.target.textContent = m ? "⛶ 还原" : "⛶ 放大"; };
document.getElementById("nextBtn").onclick=()=>randomCam();
document.getElementById("randomBtn").onclick=()=>randomCam();
function randomCam(){ const pool=CAMS.filter(c=>!c.disabled); openCam(pool[Math.floor(Math.random()*pool.length)]); }

/* 左侧列表（地图上的点在 map load 里以 GL 图层画出，贴在球面上） */
const list=document.getElementById("list");
list.innerHTML='<div class="hd">全部机位 · '+CAMS.filter(c=>!c.disabled).length+' 个</div>';
CAMS.forEach(cam=>{
  if(cam.iss){
    const b=document.createElement("button"); b.className="item"; b.dataset.name=cam.name;
    b.innerHTML="<b>🛰️ 国际空间站</b><span>轨道直播 · 不在地球表面</span>";
    b.onclick=()=>openCam(cam,false); list.appendChild(b); return;
  }
  if(!cam.disabled){
    const b=document.createElement("button"); b.className="item"; b.dataset.name=cam.name;
    const tt=camType(cam);
    const srcLabel = tt==="hls" ? ' · <span class="src">📡直连</span>' : (tt==="img"||tt==="sgapi") ? ' · <span class="src">📷快照</span>' : ' · YouTube';
    b.innerHTML="<b>"+cam.icon+" "+cam.name+"</b><span>"+cam.place+" · "+cam.cat+srcLabel+"</span>";
    b.onclick=()=>openCam(cam); list.appendChild(b);
  }
});
requestAnimationFrame(spin);
</script>
